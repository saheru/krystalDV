name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use a strong model for reviews; switch to claude-haiku-4-5
          # if you want cheaper / faster.
          model: claude-opus-4-7
          direct_prompt: |
            Review this PR for the Krystal Data Vision project.
            Focus on:
              1. Bugs / regressions / null-deref / off-by-one
              2. PySide6 pitfalls — graphics effects on widgets with inputs,
                 layout-induced cropping, threading vs the qasync loop
              3. LLM-call hygiene — token budgeting, retry/backoff, structured
                 output validation, context window overflow
              4. Excel I/O — encoding edge cases, large file performance,
                 cell-formula safety
              5. Agent / tool design — tools must be read-only over user data,
                 no filesystem/network/eval side effects
              6. Test coverage — flag any new logic without tests, and call
                 out brittle tests
              7. Style / dead code / TODOs

            Be concrete: cite file paths and line numbers. Flag the highest-
            severity issue first. If the PR is clean, say so briefly. Reply
            in Chinese.
