name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14         # Apple Silicon (arm64) runner
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyinstaller pillow

      - name: Generate icons
        run: python build/make_icon.py

      - name: Stamp build info
        id: buildinfo
        run: |
          sha=$(git rev-parse --short HEAD)
          count=$(git rev-list --count HEAD)
          date=$(date -u +"%Y%m%d")
          cat > src/kdv/_buildinfo.py <<EOF
          # Auto-generated by CI. Read by kdv/__init__.py to compose __version__.
          BUILD_DATE = "${date}"
          COMMIT_SHA = "${sha}"
          COMMIT_COUNT = ${count}
          EOF
          version=$(python -c "from kdv import __version__; print(__version__)")
          # PEP 440 versions contain '+' which is awkward in file names —
          # substitute '-' for the file-system form.
          safe=${version//+/-}
          echo "version=${version}"          >> "$GITHUB_OUTPUT"
          echo "safe_version=${safe}"        >> "$GITHUB_OUTPUT"
          echo "shortsha=${sha}"             >> "$GITHUB_OUTPUT"
          echo "Build version: ${version} (safe: ${safe})"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller build/kdv.spec --clean --noconfirm

      - name: Verify build output
        run: |
          test -d dist/kdv.app
          ls -la dist/

      - name: Zip distribution
        id: zipdist
        run: |
          safe="${{ steps.buildinfo.outputs.safe_version }}"
          zip="kdv-mac-v${safe}.zip"
          cd dist
          zip -qry "${zip}" kdv.app
          ls -la
          echo "zip=dist/${zip}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdv-mac-v${{ steps.buildinfo.outputs.safe_version }}
          path: ${{ steps.zipdist.outputs.zip }}
          retention-days: 30

      - name: Attach to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zipdist.outputs.zip }}
          generate_release_notes: true
