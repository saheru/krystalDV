name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14         # Apple Silicon (arm64) runner
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller pillow

      - name: Generate icons
        run: python build/make_icon.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller build/kdv.spec --clean --noconfirm

      - name: Verify build output
        run: |
          test -d dist/kdv.app
          ls -la dist/

      - name: Zip distribution
        run: |
          cd dist
          zip -qry kdv-mac.zip kdv.app
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdv-mac
          path: dist/kdv-mac.zip
          retention-days: 30

      - name: Attach to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kdv-mac.zip
          generate_release_notes: true
