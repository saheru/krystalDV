name: Claude Test Triage

# Whenever a build workflow fails, post a comment on the related commit
# (or PR) with Claude's diagnosis of the failing logs and a suggested fix.

on:
  workflow_run:
    workflows: ["Build Windows", "Build macOS"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download failed-run logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-logs
          gh run view ${{ github.event.workflow_run.id }} \
            --log-failed > ci-logs/failed.log || true
          tail -c 60000 ci-logs/failed.log > ci-logs/tail.log

      - name: Ask Claude to triage
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-7
          direct_prompt: |
            CI workflow `${{ github.event.workflow_run.name }}` failed on
            commit ${{ github.event.workflow_run.head_sha }}.

            The last 60 KB of the failed log is at `ci-logs/tail.log`.

            Read the log, find the actual root cause (ignore noise from
            unrelated cleanup steps), and:
              1. Quote the smallest excerpt that proves the cause.
              2. Identify the most likely culprit (file, function, or
                 dependency mismatch).
              3. Propose a concrete one-paragraph fix — no rambling.

            If the failure is a flake (timeout, network blip), say so and
            recommend re-running rather than patching.

            Reply in Chinese, ≤ 250 words.
