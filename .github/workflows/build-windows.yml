name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyinstaller pillow

      - name: Generate icons
        shell: pwsh
        run: python build/make_icon.py

      - name: Stamp build info
        id: buildinfo
        shell: pwsh
        run: |
          $sha   = (git rev-parse --short HEAD).Trim()
          $count = (git rev-list --count HEAD).Trim()
          $date  = (Get-Date -Format "yyyyMMdd")
          $body = @"
          # Auto-generated by CI. Read by kdv/__init__.py to compose __version__.
          BUILD_DATE = "$date"
          COMMIT_SHA = "$sha"
          COMMIT_COUNT = $count
          "@
          [System.IO.File]::WriteAllText("src/kdv/_buildinfo.py", $body, [System.Text.UTF8Encoding]::new($false))
          $version = python -c "from kdv import __version__; print(__version__)"
          # PEP 440 versions contain '+' which is awkward in file names and
          # GitHub artifact names — substitute '-' for the file-system form.
          $safe = $version -replace '\+','-'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "safe_version=$safe"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "shortsha=$sha"
          Write-Host "Build version: $version  (safe: $safe)"

      - name: Run unit tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller build/kdv.spec --clean --noconfirm

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\kdv\kdv.exe")) {
            Write-Error "dist\kdv\kdv.exe not found"
            exit 1
          }
          Get-Item "dist\kdv\kdv.exe" | Format-List FullName, Length

      - name: Zip distribution
        id: zipdist
        shell: pwsh
        run: |
          $safe = "${{ steps.buildinfo.outputs.safe_version }}"
          $zip  = "dist\kdv-windows-v$safe.zip"
          Compress-Archive -Path "dist\kdv\*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List FullName, Length
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdv-windows-v${{ steps.buildinfo.outputs.safe_version }}
          path: ${{ steps.zipdist.outputs.zip }}
          retention-days: 30

      - name: Attach to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zipdist.outputs.zip }}
          generate_release_notes: true
