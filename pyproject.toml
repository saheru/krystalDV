[project]
name = "krystaldatavision"
version = "0.1.0"
description = "Windows LLM data analysis tool with Excel-driven schema and multi-dimensional visualization"
requires-python = ">=3.11"
authors = [{ name = "Krystal Data Vision" }]
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
    "keyring>=25.0",
    "platformdirs>=4.2",
    "qtawesome>=1.3",
    "darkdetect>=0.8",
    "markdown>=3.6",
    "numpy>=1.26",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.6",
]

[project.scripts]
kdv = "kdv.ui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdv = ["../assets/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
